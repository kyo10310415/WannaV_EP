<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー進捗・利用状況 - WannaV ポータル</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1 class="logo">✨ WannaV ポータル</h1>
            <div class="user-info">
                <span class="user-name" id="user-name"></span>
                <button onclick="logout()" class="btn btn-secondary">ログアウト</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="nav" id="admin-nav"></div>

        <div id="alert-container"></div>

        <!-- ユーザー進捗一覧 -->
        <div class="card">
            <h2 style="margin-bottom: 30px;">📊 生徒の進捗・利用状況</h2>
            <div id="progress-container">
                <div class="loading" style="margin: 50px auto;"></div>
            </div>
            <div id="progress-pagination" style="display:flex;justify-content:center;align-items:center;gap:12px;margin-top:20px"></div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        const PAGE_SIZE = 50;
        let currentOffset = 0;

        async function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('認証失敗');

                const user = await response.json();
                document.getElementById('user-name').textContent = user.name;

                if (user.role !== '管理者' && user.role !== 'クルー') {
                    alert('管理者またはクルー権限が必要です');
                    window.location.href = '/dashboard';
                    return;
                }

                buildNav('admin-nav', user.role, '/admin/users');
                loadProgress();
            } catch (error) {
                console.error('認証エラー:', error);
                localStorage.removeItem('token');
                window.location.href = '/';
            }
        }

        async function loadProgress(offset = currentOffset) {
            const token = localStorage.getItem('token');

            try {
                const response = await fetch(`${API_URL}/admin/users/progress?limit=${PAGE_SIZE}&offset=${offset}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('進捗の取得に失敗しました');
                currentOffset = offset;
                const payload = await response.json();
                renderProgress(payload);
            } catch (error) {
                console.error('進捗読み込みエラー:', error);
                showAlert('進捗の読み込みに失敗しました', 'error');
            }
        }

        function renderProgress(payload) {
            const container = document.getElementById('progress-container');
            const progressData = payload.users || [];
            const summaryData = payload.summary || {};

            if (progressData.length === 0) {
                container.innerHTML = '<p style="color: var(--gray-text);">生徒がいません</p>';
                renderPagination(payload.pagination || {});
                return;
            }

            let html = '<div style="overflow-x:auto"><table class="table"><thead><tr><th>生徒名</th><th>メール</th><th>契約ステータス</th><th>本日の利用</th><th>今月の利用</th><th>進捗率</th><th>完了 / 総数</th><th>最終活動</th><th>学習状況</th></tr></thead><tbody>';

            progressData.forEach(user => {
                const percentage = Math.round(user.completion_percentage || 0);
                const lastActivity = user.last_activity ?
                    new Date(user.last_activity).toLocaleDateString('ja-JP') :
                    '未受講';
                const learning = learningStatusPresentation(user.learning_status);
                const contract = escHtml(user.contract_status || '未設定');

                html += `
                    <tr style="${user.learning_status === '要注意' || user.learning_status === '非アクティブ' ? 'background: rgba(243, 156, 18, 0.1);' : ''}">
                        <td><strong>${escHtml(user.name || '')}</strong></td>
                        <td>${escHtml(user.email || '')}</td>
                        <td><strong>${contract}</strong></td>
                        <td><strong>${Number(user.daily_usage_count) || 0}回</strong></td>
                        <td><strong>${Number(user.monthly_usage_count) || 0}回</strong></td>
                        <td>
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <div class="progress-bar" style="width: 150px; height: 25px;">
                                    <div class="progress-fill" style="width: ${percentage}%"></div>
                                    <span class="progress-text" style="font-size: 12px;">${percentage}%</span>
                                </div>
                            </div>
                        </td>
                        <td>
                            <strong style="color: var(--primary-pink);">${user.completed_lessons}</strong> / ${user.total_lessons}
                        </td>
                        <td>${lastActivity}</td>
                        <td>
                            <span style="color: ${learning.color}; font-weight: bold;">
                                ${learning.label}
                            </span>
                            ${user.days_since_activity != null && user.days_since_activity >= 3 ?
                                `<br><span style="color: var(--gray-text); font-size: 12px;">${user.days_since_activity}日間未活動</span>` :
                                ''}
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table></div>';

            const summary = `
                <div class="dashboard-grid" style="margin-bottom: 30px;">
                    <div class="stat-card">
                        <div class="stat-value">${summaryData.total_students || 0}</div>
                        <div class="stat-label">総生徒数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" style="color: var(--accent-cyan);">${Number(summaryData.daily_usage_count) || 0}</div>
                        <div class="stat-label">本日の利用回数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" style="color: var(--primary-blue-light);">${Number(summaryData.monthly_usage_count) || 0}</div>
                        <div class="stat-label">今月の利用回数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" style="color: var(--success);">${summaryData.contract_active_students || 0}</div>
                        <div class="stat-label">契約アクティブ</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" style="color: var(--primary-blue-light);">${summaryData.not_started_students || 0}</div>
                        <div class="stat-label">未受講</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" style="color: var(--warning);">${summaryData.warning_students || 0}</div>
                        <div class="stat-label">学習要注意</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" style="color: var(--danger);">${summaryData.inactive_students || 0}</div>
                        <div class="stat-label">7日以上未活動</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${Math.round(Number(summaryData.average_completion) || 0)}%</div>
                        <div class="stat-label">平均進捗率</div>
                    </div>
                </div>
            `;

            container.innerHTML = summary + html;
            renderPagination(payload.pagination || {});
        }

        function learningStatusPresentation(status) {
            if (status === '活動中') return { color: 'var(--success)', label: '✅ 活動中' };
            if (status === '要注意') return { color: 'var(--warning)', label: '⚠️ 要注意' };
            if (status === '非アクティブ') return { color: 'var(--danger)', label: '🚨 7日以上未活動' };
            return { color: 'var(--primary-blue-light)', label: '🆕 未受講' };
        }

        function renderPagination(pagination) {
            const pager = document.getElementById('progress-pagination');
            const total = Number(pagination.total) || 0;
            if (total <= PAGE_SIZE) {
                pager.innerHTML = '';
                return;
            }
            const page = Math.floor((Number(pagination.offset) || 0) / PAGE_SIZE) + 1;
            const pages = Math.ceil(total / PAGE_SIZE);
            pager.innerHTML = `
                <button class="btn btn-secondary" ${page <= 1 ? 'disabled' : ''} onclick="loadProgress(${Math.max(0, currentOffset - PAGE_SIZE)})">前へ</button>
                <span>${page} / ${pages} ページ（全${total}件）</span>
                <button class="btn btn-secondary" ${pagination.hasMore ? '' : 'disabled'} onclick="loadProgress(${currentOffset + PAGE_SIZE})">次へ</button>
            `;
        }

        function escHtml(value) {
            return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function showAlert(message, type) {
            const container = document.getElementById('alert-container');
            container.innerHTML = `
                <div class="alert alert-${type === 'error' ? 'error' : 'success'}">
                    ${message}
                </div>
            `;
            setTimeout(() => container.innerHTML = '', 5000);
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/';
        }

        // ===== ロールに応じたナビ生成 =====
        function buildNav(elementId, role, activePath) {
            const links = [
                { href:'/dashboard',                label:'📊 ダッシュボード',      roles:['管理者','クルー','セールス'] },
                { href:'/admin/student-management', label:'👥 生徒管理',             roles:['管理者','クルー','セールス'] },
                { href:'/admin/characters',         label:'🎭 キャラクター管理',     roles:['管理者','セールス'] },
                { href:'/admin/handovers',          label:'📋 引き継ぎ',             roles:['管理者','クルー','セールス'] },
                { href:'/admin/extensions',         label:'📅 延長審査',             roles:['管理者','クルー'] },
                { href:'/admin/surveys',            label:'⭐ 満足度',               roles:['管理者','クルー'] },
                { href:'/admin/schedule',           label:'🗓 受講スケジュール',      roles:['管理者','クルー'] },
                { href:'/admin/accounts',           label:'⚙️ 管理者用アカウント',   roles:['管理者'] },
                { href:'/admin/students-accounts',  label:'🎓 生徒用アカウント管理', roles:['管理者','セールス'] },
                { href:'/admin/contents',           label:'📹 コンテンツ管理',       roles:['管理者'] },
                { href:'/admin/users',              label:'📈 ユーザー進捗管理',     roles:['管理者','クルー'] },
                { href:'/admin/logs',               label:'📜 操作ログ',             roles:['管理者'] },
            ];
            const el = document.getElementById(elementId);
            el.innerHTML = links
                .filter(l => l.roles.includes(role))
                .map(l => `<a href="${l.href}" class="nav-link${l.href === activePath ? ' active' : ''}">${l.label}</a>`)
                .join('');
            el.style.display = 'flex';
        }

        checkAuth();
    </script>
</body>
</html>
