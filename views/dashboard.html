<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダッシュボード - WannaV ポータル</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .character-panel-content { display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap; }
        .character-current { display:flex; align-items:center; gap:18px; }
        .character-current img { width:120px; height:120px; object-fit:contain; background:#fff; border-radius:18px; border:2px solid rgba(52,200,232,0.5); }
        .character-modal { display:none; position:fixed; inset:0; z-index:2000; background:rgba(7,16,24,0.92); padding:24px; }
        .character-modal.open { display:flex; align-items:center; justify-content:center; }
        .character-modal-box { position:relative; width:min(1180px, 100%); max-height:92vh; overflow:hidden; display:flex; flex-direction:column; background:var(--card-bg); border:1px solid rgba(74,144,217,0.5); border-radius:22px; padding:24px; }
        .character-modal-header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:16px; }
        .character-close { border:none; background:none; color:var(--gray-text); font-size:28px; cursor:pointer; }
        .character-tabs { display:flex; gap:10px; margin-bottom:16px; }
        .character-tab { border:1px solid rgba(74,144,217,0.35); background:rgba(7,16,24,0.6); color:var(--gray-text); border-radius:22px; padding:9px 20px; cursor:pointer; font-weight:700; }
        .character-tab.active { color:white; border-color:var(--primary-blue); background:linear-gradient(45deg,var(--primary-blue-dark),var(--primary-blue)); }
        .character-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(145px,1fr)); gap:14px; overflow-y:auto; padding:4px 6px 10px 0; }
        .character-option { border:1px solid rgba(74,144,217,0.25); background:rgba(7,16,24,0.55); border-radius:15px; padding:8px; color:var(--light-text); cursor:pointer; transition:all .2s; }
        .character-option:hover { transform:translateY(-3px); border-color:var(--accent-cyan); box-shadow:0 8px 22px rgba(52,200,232,.2); }
        .character-option img { width:100%; aspect-ratio:1/1; object-fit:contain; border-radius:10px; display:block; background:#fff; }
        .character-option-name { display:block; margin-top:7px; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .character-grid-message { grid-column:1/-1; text-align:center; color:var(--gray-text); padding:50px 20px; }
        .character-preview { display:none; position:absolute; inset:0; z-index:5; background:var(--card-bg); padding:24px; flex-direction:column; }
        .character-preview.open { display:flex; }
        .character-preview-header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:14px; }
        .character-preview-image-wrap { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:16px; background:#fff; }
        .character-preview-image { display:block; width:100%; height:100%; max-height:calc(92vh - 210px); object-fit:contain; }
        .character-preview-footer { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:16px; }
        .character-preview-name { min-width:0; color:var(--gray-text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .character-preview-actions { display:flex; gap:10px; flex-shrink:0; }
        .course-section { padding: 22px 0 30px; border-top: 1px solid rgba(74,144,217,.22); }
        .course-section:first-child { border-top: 0; padding-top: 0; }
        .course-section:last-child { padding-bottom: 0; }
        .course-section-header { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin-bottom:12px; }
        .course-section-title { color:var(--primary-blue-light); font-size:20px; }
        .course-progress-meta { color:var(--gray-text); font-size:13px; white-space:nowrap; }
        .course-section-status { display:flex; align-items:center; justify-content:flex-end; gap:10px; flex-wrap:wrap; }
        .course-access-rule { padding:3px 9px; border-radius:999px; color:var(--gray-text); background:rgba(74,144,217,.12); font-size:11px; font-weight:700; white-space:nowrap; }
        .course-progress-bar { height:18px; margin-bottom:20px; }
        .course-progress-bar .progress-text { font-size:11px; }
        .portal-links-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; margin-bottom:24px; }
        .portal-link-card { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:24px; border:1px solid rgba(52,200,232,.45); border-radius:18px; background:linear-gradient(135deg,rgba(74,144,217,.24),rgba(155,89,182,.18)); box-shadow:0 8px 26px rgba(0,0,0,.18); }
        .portal-link-card::after { content:''; position:absolute; width:130px; height:130px; right:-55px; top:-55px; border-radius:50%; background:rgba(52,200,232,.12); }
        .portal-link-copy { min-width:0; position:relative; z-index:1; }
        .portal-link-title { color:var(--light-text); font-size:20px; }
        .portal-link-action { flex-shrink:0; position:relative; z-index:1; }
        .portal-link-action.disabled { opacity:.55; pointer-events:none; }
        @media (max-width:600px) {
            .character-modal { padding:8px; }
            .character-modal-box { padding:16px; max-height:96vh; }
            .character-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
            .character-preview { padding:16px; }
            .character-preview-image { max-height:calc(96vh - 245px); }
            .character-preview-footer { align-items:stretch; flex-direction:column; }
            .character-preview-actions { display:grid; grid-template-columns:1fr 1fr; }
            .course-section-header { align-items:flex-start; flex-direction:column; gap:6px; }
            .course-section-status { justify-content:flex-start; }
            .portal-links-grid { grid-template-columns:1fr; }
            .portal-link-card { align-items:flex-start; flex-direction:column; }
        }
    </style>
</head>
<body>
    <div id="character-modal" class="character-modal" aria-hidden="true" onclick="closeCharacterSelectorFromBackdrop(event)">
        <div class="character-modal-box" role="dialog" aria-modal="true" aria-labelledby="character-modal-title">
            <div class="character-modal-header">
                <div>
                    <h2 id="character-modal-title">🎭 キャラクター選択</h2>
                    <p style="color:var(--gray-text);font-size:13px;">選択した画像は管理者・セールスの確認後に確定します。</p>
                </div>
                <button class="character-close" onclick="closeCharacterSelector()" aria-label="閉じる">×</button>
            </div>
            <div class="character-tabs" role="tablist">
                <button id="character-tab-female" class="character-tab active" onclick="switchCharacterCategory('女性')">女性</button>
                <button id="character-tab-male" class="character-tab" onclick="switchCharacterCategory('男性')">男性</button>
            </div>
            <div id="character-grid" class="character-grid">
                <div class="character-grid-message">読み込み中...</div>
            </div>
            <div id="character-preview" class="character-preview" aria-hidden="true">
                <div class="character-preview-header">
                    <div>
                        <h2>🎭 キャラクター全体プレビュー</h2>
                        <p style="color:var(--gray-text);font-size:13px;margin-top:4px;">全体像を確認してから選択してください。</p>
                    </div>
                    <button class="character-close" onclick="closeCharacterPreview()" aria-label="一覧に戻る">×</button>
                </div>
                <div class="character-preview-image-wrap">
                    <img id="character-preview-image" class="character-preview-image" alt="キャラクター全体プレビュー">
                </div>
                <div class="character-preview-footer">
                    <p id="character-preview-name" class="character-preview-name"></p>
                    <div class="character-preview-actions">
                        <button class="btn btn-secondary" onclick="closeCharacterPreview()">一覧に戻る</button>
                        <button id="character-select-confirm" class="btn btn-primary" onclick="confirmPreviewedCharacter()">このキャラクターを選択</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="header">
        <div class="header-content">
            <h1 class="logo">✨ WannaV ポータル</h1>
            <div class="user-info">
                <span class="user-name" id="user-name"></span>
                <span class="user-role" id="user-role"></span>
                <button onclick="logout()" class="btn btn-secondary">ログアウト</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 管理者メニュー（権限に応じて動的生成） -->
        <div id="admin-menu" class="nav" style="display: none;"></div>

        <!-- 定期イベントへの外部リンク -->
        <div id="portal-links" class="portal-links-grid" aria-label="定期イベント">
            <div class="portal-link-card"><div class="loading" style="margin:auto;"></div></div>
            <div class="portal-link-card"><div class="loading" style="margin:auto;"></div></div>
        </div>

        <!-- 生徒キャラクター選択 -->
        <div id="student-character-panel" class="card" style="display:none">
            <div id="student-character-content" class="character-panel-content"></div>
        </div>

        <!-- 進捗統計 -->
        <div class="dashboard-grid">
            <div class="stat-card">
                <div class="stat-value" id="completion-rate">0%</div>
                <div class="stat-label">履修進捗率</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completed-lessons">0</div>
                <div class="stat-label">完了レッスン数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-lessons">0</div>
                <div class="stat-label">総レッスン数</div>
            </div>
        </div>

        <!-- コース別レッスン・進捗 -->
        <div class="card">
            <h2 style="margin-bottom: 30px;">📚 コース別レッスン</h2>
            <div id="lessons-container">
                <div class="loading" style="margin: 50px auto;"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let currentUser = null;
        let characterImages = { 女性: [], 男性: [] };
        let currentCharacterCategory = '女性';
        let visibleCharacterImages = [];
        let previewedCharacter = null;
        let characterSelectionSubmitting = false;

        // 認証チェック
        async function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('認証失敗');

                currentUser = await response.json();
                document.getElementById('user-name').textContent = currentUser.name;
                document.getElementById('user-role').textContent = currentUser.role;

                buildNav('admin-menu', currentUser.role, '/dashboard');
                if (currentUser.role === '生徒') {
                    loadCharacterStatus();
                    void recordAppOpen();
                }

                loadDashboard();
            } catch (error) {
                console.error('認証エラー:', error);
                localStorage.removeItem('token');
                window.location.href = '/';
            }
        }

        async function recordAppOpen() {
            try {
                const response = await fetch(`${API_URL}/usage/open`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                if (!response.ok) throw new Error('利用回数の記録に失敗しました');
            } catch (error) {
                // 記録失敗で生徒のダッシュボード利用を妨げない。
                console.warn('利用回数の記録エラー:', error);
            }
        }

        async function characterFetch(path, options = {}) {
            const response = await fetch(`${API_URL}${path}`, {
                ...options,
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('token')}`,
                    'Content-Type': 'application/json',
                    ...(options.headers || {})
                }
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || '処理に失敗しました');
            return data;
        }

        async function loadCharacterStatus() {
            const panel = document.getElementById('student-character-panel');
            const content = document.getElementById('student-character-content');
            panel.style.display = '';
            content.innerHTML = '<p style="color:var(--gray-text)">キャラクター情報を読み込み中...</p>';
            try {
                const data = await characterFetch('/characters/me');
                if (!data.selection) {
                    content.innerHTML = `
                        <div>
                            <h2>🎭 キャラクターを選択</h2>
                            <p style="color:var(--gray-text);margin-top:5px">自分専用のキャラクターを1つ選んでください。</p>
                        </div>
                        <button class="btn btn-primary" onclick="openCharacterSelector()">キャラクター選択</button>`;
                    return;
                }

                const selection = data.selection;
                const statusText = selection.status === 'confirmed'
                    ? '✅ キャラクター確定済み'
                    : '⏳ 確認待ち';
                content.innerHTML = `
                    <div class="character-current">
                        <img src="${selection.imageUrl}?size=360" alt="選択したキャラクター">
                        <div>
                            <h2>🎭 選択したキャラクター</h2>
                            <p style="color:var(--accent-cyan);font-weight:700;margin-top:6px">${statusText}</p>
                            <p style="color:var(--gray-text);font-size:12px;margin-top:3px">${escHtml(selection.fileName)}</p>
                        </div>
                    </div>`;
            } catch (error) {
                content.innerHTML = `<p style="color:var(--danger)">${escHtml(error.message)}</p>`;
            }
        }

        async function openCharacterSelector() {
            closeCharacterPreview();
            const modal = document.getElementById('character-modal');
            modal.classList.add('open');
            modal.setAttribute('aria-hidden', 'false');
            document.getElementById('character-grid').innerHTML = '<div class="character-grid-message">画像を読み込み中...</div>';
            try {
                const data = await characterFetch('/characters/available');
                characterImages = data.images || { 女性: [], 男性: [] };
                switchCharacterCategory('女性');
            } catch (error) {
                document.getElementById('character-grid').innerHTML = `<div class="character-grid-message" style="color:var(--danger)">${escHtml(error.message)}</div>`;
            }
        }

        function closeCharacterSelector() {
            closeCharacterPreview();
            const modal = document.getElementById('character-modal');
            modal.classList.remove('open');
            modal.setAttribute('aria-hidden', 'true');
        }

        function closeCharacterSelectorFromBackdrop(event) {
            if (event.target.id === 'character-modal') closeCharacterSelector();
        }

        function switchCharacterCategory(category) {
            closeCharacterPreview();
            currentCharacterCategory = category;
            document.getElementById('character-tab-female').classList.toggle('active', category === '女性');
            document.getElementById('character-tab-male').classList.toggle('active', category === '男性');
            visibleCharacterImages = characterImages[category] || [];
            const grid = document.getElementById('character-grid');
            if (!visibleCharacterImages.length) {
                grid.innerHTML = '<div class="character-grid-message">選択できる画像がありません</div>';
                return;
            }
            grid.innerHTML = visibleCharacterImages.map((image, index) => `
                <button class="character-option" onclick="previewCharacter(${index})" title="${escHtml(image.fileName)}を全体表示">
                    <img src="${image.imageUrl}?size=360" alt="${escHtml(image.fileName)}" loading="lazy">
                    <span class="character-option-name">${escHtml(image.fileName)}</span>
                </button>`).join('');
        }

        function previewCharacter(index) {
            const image = visibleCharacterImages[index];
            if (!image) return;
            previewedCharacter = image;
            document.getElementById('character-preview-image').src = `${image.imageUrl}?full=1`;
            document.getElementById('character-preview-image').alt = `${image.fileName}の全体プレビュー`;
            document.getElementById('character-preview-name').textContent = image.fileName;
            const preview = document.getElementById('character-preview');
            preview.classList.add('open');
            preview.setAttribute('aria-hidden', 'false');
        }

        function closeCharacterPreview() {
            previewedCharacter = null;
            const preview = document.getElementById('character-preview');
            if (!preview) return;
            preview.classList.remove('open');
            preview.setAttribute('aria-hidden', 'true');
            document.getElementById('character-preview-image').removeAttribute('src');
        }

        async function confirmPreviewedCharacter() {
            const image = previewedCharacter;
            if (characterSelectionSubmitting || !image || !confirm('このキャラクターでいいですか？')) return;
            const confirmButton = document.getElementById('character-select-confirm');
            characterSelectionSubmitting = true;
            confirmButton.disabled = true;
            confirmButton.textContent = '選択中...';
            try {
                const data = await characterFetch('/characters/select', {
                    method: 'POST',
                    body: JSON.stringify({ fileId: image.fileId })
                });
                alert(data.message || 'キャラクターを選択しました');
                closeCharacterSelector();
                await loadCharacterStatus();
            } catch (error) {
                alert(error.message);
                if (error.message.includes('他の生徒')) openCharacterSelector();
            } finally {
                characterSelectionSubmitting = false;
                confirmButton.disabled = false;
                confirmButton.textContent = 'このキャラクターを選択';
            }
        }

        function escHtml(value) {
            return String(value || '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
                .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
        }

        // ダッシュボード読み込み
        async function loadDashboard() {
            const token = localStorage.getItem('token');

            try {
                const [progressRes, lessonsRes, portalLinksRes] = await Promise.all([
                    fetch(`${API_URL}/progress`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    }),
                    fetch(`${API_URL}/lessons`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    }),
                    fetch(`${API_URL}/portal/links`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    })
                ]);
                if (!progressRes.ok || !lessonsRes.ok) throw new Error('データ取得に失敗しました');

                const progressData = await progressRes.json();
                const stats = progressData.stats;
                const lessons = await lessonsRes.json();
                const portalLinks = portalLinksRes.ok ? await portalLinksRes.json() : null;

                document.getElementById('completion-rate').textContent = 
                    Math.round(stats.completion_percentage || 0) + '%';
                document.getElementById('completed-lessons').textContent = stats.completed_lessons || 0;
                document.getElementById('total-lessons').textContent = stats.total_lessons || 0;

                if (portalLinks) renderPortalLinks(portalLinks);
                else document.getElementById('portal-links').innerHTML = '<div class="portal-link-card" style="grid-column:1/-1;color:var(--gray-text);">定期イベント情報を取得できませんでした</div>';
                renderLessons(lessons, currentUser.role, progressData.courseStats || []);
            } catch (error) {
                console.error('データ読み込みエラー:', error);
                document.getElementById('lessons-container').innerHTML = 
                    '<p style="color: var(--danger);">データの読み込みに失敗しました</p>';
            }
        }

        function renderPortalLinks(data) {
            const entries = [data.bucchakeVtuber, data.classLesson].filter(Boolean);
            document.getElementById('portal-links').innerHTML = entries.map(item => {
                const action = item.url
                    ? `<a class="btn btn-primary portal-link-action" href="${escHtml(item.url)}" target="_blank" rel="noopener noreferrer">ページを開く ↗</a>`
                    : '<span class="btn btn-secondary portal-link-action disabled">URL未設定</span>';
                return `<article class="portal-link-card">
                    <div class="portal-link-copy">
                        <h2 class="portal-link-title">${escHtml(item.title)}</h2>
                    </div>${action}
                </article>`;
            }).join('');
        }

        // レッスン描画
        function renderLessons(lessons, userRole, courseStats) {
            const container = document.getElementById('lessons-container');
            const isStudent = userRole === '生徒';
            
            if (lessons.length === 0) {
                container.innerHTML = '<p style="color: var(--gray-text);">レッスンがまだありません</p>';
                return;
            }

            const groupedCourses = [];
            const groupMap = new Map();
            lessons.forEach(lesson => {
                const key = String(lesson.course_id ?? lesson.course_title ?? 'uncategorized');
                if (!groupMap.has(key)) {
                    const group = {
                        key,
                        courseId: lesson.course_id,
                        title: lesson.course_title || 'コース未設定',
                        sequentialUnlock: lesson.sequential_unlock === true,
                        lessons: []
                    };
                    groupMap.set(key, group);
                    groupedCourses.push(group);
                }
                groupMap.get(key).lessons.push(lesson);
            });

            const statsMap = new Map((courseStats || []).map(stat => [String(stat.course_id), stat]));
            let html = '';

            groupedCourses.forEach(group => {
                const courseStat = statsMap.get(String(group.courseId));
                const totalLessons = Number(courseStat?.total_lessons ?? group.lessons.length);
                const completedLessons = Number(courseStat?.completed_lessons ?? group.lessons.filter(item => item.completed).length);
                const percentage = Math.round(Number(courseStat?.completion_percentage) || (totalLessons ? completedLessons / totalLessons * 100 : 0));

                html += `
                    <section class="course-section">
                        <div class="course-section-header">
                            <h3 class="course-section-title">📘 ${escHtml(group.title)}</h3>
                            <div class="course-section-status">
                                <span class="course-access-rule">${group.sequentialUnlock ? '🔒 順次解禁' : '🔓 全レッスン公開'}</span>
                                <span class="course-progress-meta">${completedLessons} / ${totalLessons} レッスン完了</span>
                            </div>
                        </div>
                        <div class="progress-bar course-progress-bar" aria-label="${escHtml(group.title)}の進捗 ${percentage}%">
                            <div class="progress-fill" style="width:${percentage}%"></div>
                            <span class="progress-text">${percentage}%</span>
                        </div>
                        <div class="lessons-grid">`;

                group.lessons.forEach((lesson, index) => {
                    const isCompleted = lesson.completed;
                    // アンロック判定はコース内の並びごとに行う。
                    const previousLesson = group.lessons[index - 1];
                    const isLocked = isStudent && group.sequentialUnlock && index > 0 && !previousLesson.completed;
                    const canAccess = !isStudent || !group.sequentialUnlock || index === 0 || previousLesson.completed;

                    // サムネイル生成
                    const thumb = getThumbnail(lesson.video_url, lesson.thumbnail_url, lesson.content_type);

                    // カテゴリタグの色
                    const tagColor = getCourseTagColor(lesson.course_title);

                    const cardClass = 'lesson-card' +
                        (isCompleted ? ' completed' : '') +
                        (isLocked   ? ' locked'    : '');

                    const overlayIcon = isCompleted ? '✅' : isLocked ? '🔒' : lesson.content_type === 'link' ? '↗' : lesson.content_type === 'image' ? '🔍' : '▶';
                    const overlayClass = isCompleted ? 'thumb-overlay completed' : isLocked ? 'thumb-overlay locked' : 'thumb-overlay play';

                    const linkStart = canAccess ? `<a href="/lesson/${Number(lesson.id)}" class="lesson-card-link">` : `<div class="lesson-card-link no-pointer">`;
                    const linkEnd   = canAccess ? `</a>` : `</div>`;

                    const wp = Math.min(100, Math.max(0, Number(lesson.watch_percent) || 0));
                    let watchBarHtml = '';
                    if (!isLocked) {
                        if (isCompleted) {
                            watchBarHtml = `
                                <div class="lesson-watch-bar-wrap">
                                    <div class="lesson-watch-bar-header">
                                        <span>視聴進捗</span><span class="lesson-watch-bar-pct done">100%</span>
                                    </div>
                                    <div class="lesson-watch-bar-bg">
                                        <div class="lesson-watch-bar-fill done" style="width:100%;"></div>
                                    </div>
                                </div>`;
                        } else {
                            const pctColor = wp >= 95 ? 'near' : wp >= 50 ? 'mid' : 'low';
                            watchBarHtml = `
                                <div class="lesson-watch-bar-wrap">
                                    <div class="lesson-watch-bar-header">
                                        <span>視聴進捗</span><span class="lesson-watch-bar-pct ${pctColor}">${wp}%</span>
                                    </div>
                                    <div class="lesson-watch-bar-bg">
                                        <div class="lesson-watch-bar-fill ${pctColor}" style="width:${wp}%;"></div>
                                    </div>
                                </div>`;
                        }
                    }

                    html += `
                        ${linkStart}
                        <div class="${cardClass}">
                            <div class="lesson-thumb-wrap">
                                ${thumb.type === 'img'
                                    ? `<img src="${escHtml(thumb.src)}" alt="${escHtml(lesson.title)}" class="lesson-thumb-img" loading="lazy">`
                                    : `<div class="lesson-thumb-placeholder"><span>${thumb.emoji}</span></div>`
                                }
                                <div class="${overlayClass}">
                                    <span class="overlay-icon">${overlayIcon}</span>
                                </div>
                                ${isCompleted ? '<div class="thumb-badge-done">✅ 完了</div>' : ''}
                            </div>
                            <div class="lesson-card-body">
                                <div class="lesson-card-title">${escHtml(lesson.title)}</div>
                                <div class="lesson-card-meta">
                                    <span class="lesson-tag" style="background:${tagColor.bg}; color:${tagColor.text};">${escHtml(lesson.course_title || 'コース')}</span>
                                    ${isCompleted ? '<span class="lesson-tag-done">✅ 学習済み</span>' : ''}
                                    ${isLocked ? '<span class="lesson-tag-locked">🔒 ロック中</span>' : ''}
                                </div>
                                ${watchBarHtml}
                            </div>
                        </div>
                        ${linkEnd}`;
                });

                html += '</div></section>';
            });

            container.innerHTML = html;
        }

        // サムネイル取得ロジック
        function getThumbnail(videoUrl, thumbnailUrl, contentType = 'video') {
            // 1. DBに保存されたサムネイル（MP4アップロード時に自動生成）
            if (thumbnailUrl) {
                return { type: 'img', src: thumbnailUrl };
            }

            if (!videoUrl) return { type: 'placeholder', emoji: contentType === 'link' ? '🔗' : contentType === 'image' ? '🖼️' : '🎬' };

            // 2. YouTube: 動画IDからサムネイルURL自動生成
            const ytMatch = videoUrl.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
            if (ytMatch) {
                return { type: 'img', src: `https://img.youtube.com/vi/${ytMatch[1]}/mqdefault.jpg` };
            }

            // 3. Vimeo (APIなしのデフォルトサムネイル)
            if (videoUrl.includes('vimeo.com')) {
                return { type: 'placeholder', emoji: '🎥' };
            }

            // 4. Google Drive
            if (videoUrl.includes('drive.google.com')) {
                return { type: 'placeholder', emoji: '📁' };
            }

            // 5. 直接動画ファイル（サムネイル未生成）
            if (videoUrl.match(/\.(mp4|mov|avi|mkv)$/i)) {
                return { type: 'placeholder', emoji: '📹' };
            }

            return { type: 'placeholder', emoji: '🎬' };
        }

        // コースごとのタグカラー（ローテーション）
        const TAG_COLORS = [
            { bg: 'rgba(74,144,217,0.25)',  text: '#6FB3F5' },
            { bg: 'rgba(52,200,232,0.2)',   text: '#34C8E8' },
            { bg: 'rgba(155,89,182,0.25)',  text: '#BF8FE0' },
            { bg: 'rgba(46,204,113,0.2)',   text: '#6AEBB7' },
            { bg: 'rgba(243,156,18,0.2)',   text: '#F7C55B' },
            { bg: 'rgba(231,76,60,0.2)',    text: '#F1948A' },
        ];
        const _tagMap = {};
        let _tagIdx = 0;
        function getCourseTagColor(course) {
            const key = course || 'default';
            if (!_tagMap[key]) {
                _tagMap[key] = TAG_COLORS[_tagIdx % TAG_COLORS.length];
                _tagIdx++;
            }
            return _tagMap[key];
        }

        // ログアウト
        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/';
        }

        // ===== ロールに応じたナビ生成 =====
        function buildNav(elementId, role, activePath) {
            const isAdmin = role === '管理者';
            const links = [
                { href: '/dashboard',                label: '📊 ダッシュボード',          roles: ['管理者', 'クルー', 'セールス', '生徒'] },
                { href: '/special-contents',         label: '✨ スペシャルコンテンツ',    roles: ['管理者', 'クルー', 'セールス', '生徒'] },
                { href: '/admin/student-management', label: '👥 生徒管理',                roles: ['管理者', 'クルー', 'セールス'] },
                { href: '/admin/characters',         label: '🎭 キャラクター管理',        roles: ['管理者', 'セールス'] },
                { href: '/admin/handovers',          label: '📋 引き継ぎ',                roles: ['管理者', 'クルー', 'セールス'] },
                { href: '/admin/extensions',         label: '📅 延長審査',                roles: ['管理者', 'クルー'] },
                { href: '/admin/surveys',            label: '⭐ 満足度',                  roles: ['管理者', 'クルー'] },
                { href: '/admin/schedule',           label: '🗓 受講スケジュール',          roles: ['管理者', 'クルー'] },
                { href: '/admin/accounts',           label: '⚙️ 管理者用アカウント',      roles: ['管理者'] },
                { href: '/admin/students-accounts',  label: '🎓 生徒用アカウント管理',    roles: ['管理者', 'セールス'] },
                { href: '/admin/contents',           label: '📹 コンテンツ管理',          roles: ['管理者'] },
                { href: '/admin/users',              label: '📈 ユーザー進捗管理',        roles: ['管理者', 'クルー'] },
                { href: '/admin/logs',               label: '📜 操作ログ',                roles: ['管理者'] },
            ];
            const el = document.getElementById(elementId);
            el.innerHTML = links
                .filter(l => l.roles.includes(role))
                .map(l => `<a href="${l.href}" class="nav-link${l.href === activePath ? ' active' : ''}">${l.label}</a>`)
                .join('');
            el.style.display = 'flex';
        }

        // 初期化
        checkAuth();
    </script>
